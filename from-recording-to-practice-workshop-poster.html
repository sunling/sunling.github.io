<p>一个关于「怎么把自己记录下来」的实践工作坊</p>
<h1>从记录到实践</h1>
<p>想记的东西很多，却总卡在「放哪里」？先别急着分类。用七天真实记录，找到一个能持续的入口。</p>
<p><strong>先按时间接住，再从实践里长出结构。</strong></p>
<p>阅读、对话、生活触动先进入时间轴；持续发生的事情，再慢慢成为你的项目和练习场。</p>
<h2>第一场｜找到一个愿意开始的入口</h2>
<p>聊清楚为什么记、可以记什么，减少分类和工具选择带来的阻力。</p>
<h2>七天实践｜按时间接住七天生活</h2>
<p>记录当天的生活、输入、对话和触动，不要求写长日记。</p>
<h2>第二场｜从记录里长出自己的实践</h2>
<p>看真实材料，现场拆解卡点，也打开我的 GitHub + Codex 实践方式。</p>
</main>
