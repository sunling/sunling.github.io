<!DOCTYPE html>
<html lang="zh-CN" data-document-role="page" data-label="第二期工作坊海报">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 时代的个人输入输出系统工作坊｜第二期海报</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eaf0f8;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#172033}.poster{position:relative;width:720px;height:960px;overflow:hidden;padding:62px;background:linear-gradient(155deg,#fff 0%,#f6f9ff 70%,#eaf2ff 100%)}.poster:before{content:"";position:absolute;width:420px;height:420px;border:95px solid rgba(37,99,235,.07);border-radius:50%;right:-210px;top:-190px}.top,.bottom{position:relative;z-index:1}.badge{display:inline-block;padding:9px 15px;border:1px solid #93b9fb;border-radius:999px;color:#1d4ed8;font-size:17px;font-weight:800;letter-spacing:.04em}.kicker{margin:70px 0 14px;color:#2563eb;font-size:21px;font-weight:800}h1{margin:0;max-width:570px;color:#102452;font-size:62px;line-height:1.13;letter-spacing:-.05em}.belief{margin:30px 0 0;max-width:555px;color:#344869;font-size:25px;font-weight:750;line-height:1.55}.path{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:55px}.step{padding:18px 15px;border-top:3px solid #2563eb;background:rgba(255,255,255,.78)}.step b{display:block;color:#102452;font-size:18px;margin-bottom:6px}.step span{color:#64748b;font-size:15px}.bottom{position:absolute;left:62px;right:62px;bottom:54px;display:flex;align-items:end;justify-content:space-between;border-top:1px solid #cbdaf0;padding-top:25px}.meta{font-size:17px;line-height:1.8;color:#52637c}.meta strong{display:block;color:#102452;font-size:20px}.qr{text-align:center;color:#52637c;font-size:13px;font-weight:700}.qr img{display:block;width:116px;height:116px;margin-bottom:8px;padding:5px;background:#fff;border:1px solid #cbdaf0}
  </style>
</head>
<body>
  <main class="poster" id="poster">
    <div class="top">
      <span class="badge">第二期 · 报名意向开放</span>
      <p class="kicker">AI 时代的</p>
      <h1>个人输入输出系统工作坊</h1>
      <p class="belief">先观察生活，<br />再让系统从真实需要中长出来。</p>
      <div class="path">
        <div class="step"><b>第一场</b><span>看见路径与断点</span></div>
        <div class="step"><b>七天</b><span>继续真实记录</span></div>
        <div class="step"><b>第二场</b><span>打通最小 MVP</span></div>
      </div>
    </div>
    <div class="bottom">
      <div class="meta"><strong>线上 · 时间待定</strong>不要求统一工具 · 不需要编程基础<br />主理人：孙玲</div>
      <div class="qr"><img src="assets/input-output-workshop-second-qr.png" alt="第二期报名页面二维码" />扫码留下报名意向</div>
    </div>
  </main>

</html>
